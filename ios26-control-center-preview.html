<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 26 Control Center UI - Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .device-frame {
            width: 393px;
            height: 852px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1e 100%);
            border-radius: 50px;
            padding: 20px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .device-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 35px;
            background: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #1a1a2e 0%, #251a3e 30%, #0f0f1e 100%);
            border-radius: 40px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 60px 20px 30px;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .status-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #30d158;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-text {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            font-weight: 500;
        }

        /* Main Timer Card */
        .timer-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .activity-icon {
            width: 100px;
            height: 100px;
            background: rgba(0,122,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 44px;
        }

        .timer-display {
            font-size: 64px;
            font-weight: 200;
            color: white;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .activity-name {
            font-size: 17px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 24px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: transform 0.2s;
        }

        .control-btn:hover {
            transform: scale(1.05);
        }

        .control-btn.start {
            background: rgba(48,209,88,0.2);
            border: 1px solid rgba(48,209,88,0.4);
            color: #30d158;
        }

        .control-btn.stop {
            background: rgba(255,59,48,0.2);
            border: 1px solid rgba(255,59,48,0.4);
            color: #ff3b30;
        }

        /* Quick Activity Grid */
        .activity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .activity-btn {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .activity-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .activity-btn.active {
            background: rgba(255,255,255,0.3);
            border-color: rgba(0,122,255,0.5);
        }

        .activity-icon-small {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .activity-btn.gym .activity-icon-small { background: rgba(255,59,48,0.3); color: #ff3b30; }
        .activity-btn.running .activity-icon-small { background: rgba(255,149,0,0.3); color: #ff9500; }
        .activity-btn.work .activity-icon-small { background: rgba(88,86,214,0.3); color: #5856d6; }
        .activity-btn.reading .activity-icon-small { background: rgba(175,82,222,0.3); color: #af52de; }

        .activity-info h4 {
            color: white;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .activity-info p {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-icon {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .stat-card:nth-child(1) .stat-icon { color: #af52de; }
        .stat-card:nth-child(2) .stat-icon { color: #007aff; }
        .stat-card:nth-child(3) .stat-icon { color: #ff9500; }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            font-weight: 500;
        }

        /* Recent Sessions */
        .sessions-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .sessions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .sessions-title {
            font-size: 20px;
            font-weight: 600;
            color: white;
        }

        .see-all {
            font-size: 15px;
            color: #007aff;
            text-decoration: none;
            font-weight: 500;
        }

        .session-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .session-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .session-row.gym .session-icon { background: rgba(255,59,48,0.2); color: #ff3b30; }
        .session-row.work .session-icon { background: rgba(88,86,214,0.2); color: #5856d6; }
        .session-row.reading .session-icon { background: rgba(175,82,222,0.2); color: #af52de; }

        .session-info {
            flex: 1;
        }

        .session-name {
            color: white;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .session-date {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
        }

        .session-duration {
            color: rgba(255,255,255,0.8);
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* Bottom indicator */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 135px;
            height: 5px;
            background: white;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <h1 class="status-title">Control Center</h1>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    <span class="live-text">Tracking</span>
                </div>
            </div>

            <!-- Main Timer Card -->
            <div class="timer-card">
                <div class="activity-icon">🏋️</div>
                <div class="timer-display">00:42:15</div>
                <div class="activity-name">Gym Workout</div>
                <div class="controls">
                    <button class="control-btn stop">⏹</button>
                </div>
            </div>

            <!-- Quick Activity Grid -->
            <div class="activity-grid">
                <div class="activity-btn gym active">
                    <div class="activity-icon-small">🏋️</div>
                    <div class="activity-info">
                        <h4>Gym</h4>
                        <p>In Progress</p>
                    </div>
                </div>
                <div class="activity-btn running">
                    <div class="activity-icon-small">🏃</div>
                    <div class="activity-info">
                        <h4>Running</h4>
                        <p>Tap to start</p>
                    </div>
                </div>
                <div class="activity-btn work">
                    <div class="activity-icon-small">💼</div>
                    <div class="activity-info">
                        <h4>Work</h4>
                        <p>Tap to start</p>
                    </div>
                </div>
                <div class="activity-btn reading">
                    <div class="activity-icon-small">📚</div>
                    <div class="activity-info">
                        <h4>Reading</h4>
                        <p>Tap to start</p>
                    </div>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon">🔢</div>
                    <div class="stat-value">24</div>
                    <div class="stat-label">Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏱</div>
                    <div class="stat-value">48h</div>
                    <div class="stat-label">Total Time</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value">8</div>
                    <div class="stat-label">Activities</div>
                </div>
            </div>

            <!-- Recent Sessions -->
            <div class="sessions-card">
                <div class="sessions-header">
                    <h3 class="sessions-title">Recent Sessions</h3>
                    <a href="#" class="see-all">See All</a>
                </div>
                <div class="session-row gym">
                    <div class="session-icon">🏋️</div>
                    <div class="session-info">
                        <div class="session-name">Gym</div>
                        <div class="session-date">Today</div>
                    </div>
                    <div class="session-duration">1h 15m</div>
                </div>
                <div class="session-row work">
                    <div class="session-icon">💼</div>
                    <div class="session-info">
                        <div class="session-name">Work</div>
                        <div class="session-date">Yesterday</div>
                    </div>
                    <div class="session-duration">4h 30m</div>
                </div>
                <div class="session-row reading">
                    <div class="session-icon">📚</div>
                    <div class="session-info">
                        <div class="session-name">Reading</div>
                        <div class="session-date">Yesterday</div>
                    </div>
                    <div class="session-duration">45m</div>
                </div>
            </div>
        </div>
        <div class="home-indicator"></div>
    </div>
</body>
</html>
